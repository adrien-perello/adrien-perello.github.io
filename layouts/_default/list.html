{{ define "main" }}
  <article class="page-shell">
    <header class="page-header">
      {{ with .Params.kicker }}<p class="eyebrow">{{ . }}</p>{{ end }}
      <h1>{{ .Title }}</h1>
      {{ with .Params.lead }}<p class="page-lead">{{ . }}</p>{{ end }}
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
  </article>
{{ end }}
